[project]
name = "finn"
version = "0.1.0"
description = "Finn - personal double-entry accounting with AI assistance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "lxml>=5.3",
  "openai>=1.55",
  "weasyprint>=63",
  "jinja2>=3.1",
  "python-multipart>=0.0.17",
  "pillow>=11",
  "pillow-heif>=0.20",
  "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
