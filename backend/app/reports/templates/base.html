<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4; margin: 16mm 14mm 18mm 14mm;
    @bottom-left { content: "{{ ledger_name }} · {{ generated }}"; font-family: "DejaVu Sans", sans-serif; font-size: 7.5pt; color: #666; }
    @bottom-right { content: counter(page) " / " counter(pages); font-family: "DejaVu Sans", sans-serif; font-size: 7.5pt; color: #666; } }
  body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 9pt; color: #1a1a1a; }
  h1 { font-size: 16pt; margin: 0 0 2mm 0; }
  h2 { font-size: 11.5pt; margin: 6mm 0 2mm 0; border-bottom: 1.5px solid #0f766e; padding-bottom: 1mm; color: #0f766e; }
  .sub { color: #555; margin-bottom: 5mm; }
  table { width: 100%; border-collapse: collapse; page-break-inside: auto; }
  tr { page-break-inside: avoid; }
  th { text-align: left; font-weight: 600; border-bottom: 1px solid #999; padding: 1.4mm 1.5mm; font-size: 8.5pt; }
  td { padding: 1.1mm 1.5mm; border-bottom: 0.5px solid #e2e2e2; vertical-align: top; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .grp td { font-weight: 600; background: #f4f6f6; }
  .tot td { font-weight: 700; border-top: 1.5px solid #333; border-bottom: none; }
  .muted { color: #777; }
  .neg { color: #b91c1c; }
  .cols { display: flex; gap: 8mm; }
  .cols > div { flex: 1; }
  .warn { color: #b45309; font-weight: 600; }
  .small { font-size: 7.5pt; }
</style>
</head>
<body>
<h1>{{ title }}</h1>
<div class="sub">{{ subtitle }}</div>
{% block content %}{% endblock %}
</body>
</html>
