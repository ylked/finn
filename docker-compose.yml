services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-finn}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finn} -d ${POSTGRES_DB:-finn}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: finn:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finn}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"

volumes:
  db-data:
  uploads:
